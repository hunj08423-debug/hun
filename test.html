<!doctype html>

<title>AI 품질 시험</title>
<style>
:root { --bg: #F5F7F6; --surface: #FFFFFF; --ink: #1B2421; --muted: #5B6863; --line: #D9E1DE; --accent: #0F5E55; --accent-ink: #FFFFFF; --err: #A33A2B; }
@media (prefers-color-scheme: dark) { :root { --bg: #111816; --surface: #18211F; --ink: #E7EEEB; --muted: #A2B0AB; --line: #2C3835; --accent: #5CC3B2; --accent-ink: #0E1715; --err: #F08A7A; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
p { margin: .4rem 0; }
.muted { color: var(--muted); font-size: .92rem; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; }
button { font: inherit; font-weight: 700; padding: .7rem 1.2rem; border-radius: .8rem; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
#status { font-weight: 700; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem 1.1rem; margin: .9rem 0; }
.case h2 { font-size: 1.05rem; margin: 0 0 .4rem; }
.case pre { white-space: pre-wrap; word-break: break-word; font: inherit; font-size: .93rem; margin: .3rem 0 0; }
.err { color: var(--err); }
iframe { position: absolute; left: -10000px; top: 0; width: 390px; height: 800px; border: 0; }
</style>
</head>
<body>
<main>
  <h1>AI 품질 시험</h1>
  <p><b>기본 시험</b>(10개, 2~3분)은 평소 쓰임새를, <b>강한 시험</b>(14개, 5~8분)은 위기 신호·악용 시도·지시 무시 요구·한쪽으로 치우친 대답처럼 일부러 어려운 상황을 실제 연습실과 똑같은 지시문으로 보냅니다. 비용은 각각 몇십 원 안쪽입니다.</p>
  <p class="muted">끝나면 '결과 복사하기'를 눌러 Claude에게 붙여 주세요. 이 페이지는 아무것도 저장하지 않습니다. 시험이 모두 끝나면 이 파일은 저장소에서 지워도 됩니다.</p>
  <div class="row"><button id="runBasic" type="button">기본 시험</button><button id="runHard" type="button">강한 시험</button><button id="copy" class="ghost" type="button" disabled>결과 복사하기</button></div>
  <p id="status" role="status">준비 중…</p>
  <div id="out"></div>
  <iframe id="app" src="index.html" title="연습실 (시험용, 보이지 않음)" aria-hidden="true" tabindex="-1"></iframe>
</main>

const $ = id => document.getElementById(id);
const frame = $("app");
let W = null, report = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function ready() {
  for (let i = 0; i < 60; i++) {
    try { W = frame.contentWindow; const ai = W.eval("S.ai"); if (ai === "yes") return true; if (ai === "no") return false; } catch (e) {}
    await sleep(250);
  }
  return false;
}
function pick(list, start) { return list.find(x => x.startsWith(start)) || list[0]; }
function show(title, body, bad) {
  const d = document.createElement("section"); d.className = "case";
  d.innerHTML = `<h2>${esc(title)}</h2><pre class="${bad ? "err" : ""}">${esc(body)}</pre>`;
  $("out").appendChild(d);
}
function reviewText(r) {
  if (!r) return "(돌아보기를 받지 못함)";
  const names = { welcome: "반겼나", separate: "나눴나", own: "정직하게", door: "문 열기" };
  return [`요약: ${r.summary}`, ...r.checks.map(c => `- ${names[c.key] || c.key}: ${c.status} · ${c.note}`), `좋았던 말: ${r.good || "(빈칸)"}`, `다음엔: ${r.tryLine}`, `속마음: ${r.kid}`].join("\n");
}
async function timed(code) { const t = Date.now(); await W.eval(code); return ((Date.now() - t) / 1000).toFixed(1) + "초"; }

async function runChat(c, n) {
  const lines = [], times = [];
  if (c.expect) lines.push(`(보려는 것: ${c.expect})`);
  W.eval(`S.ai = "yes"; startChat(scenById(${JSON.stringify(c.scene)}));`);
  lines.push(`[${W.eval("S.persona.name")} · ${W.eval("S.persona.grade")}] ${W.eval("S.persona.opening")}`);
  for (let i = 0; i < c.answers.length; i++) {
    W.eval(`S.turns.push({ who: "me", text: ${JSON.stringify(c.answers[i])} }); S.mine++; S.notice = "";`);
    lines.push(`선생님: ${c.answers[i]}`);
    times.push(await timed("askKid()"));
    const last = W.eval("S.turns[S.turns.length - 1]");
    if (W.eval("S.notice")) { lines.push(`[오류] ${W.eval("S.notice")}`); return finish(c, n, lines, times, true); }
    lines.push(`${W.eval("S.persona.name")}: ${last.who === "kid" ? last.text : "(대답 없음)"}`);
    if (c.hint && i === 0) {
      times.push(await timed("askHint()"));
      lines.push(`[코치 귀띔] ${W.eval("S.hint") || "(없음) " + W.eval("S.notice")}`);
    }
  }
  if (c.review) {
    times.push(await timed("startReview()"));
    lines.push("[돌아보기]", W.eval("S.review") ? reviewText(W.eval("S.review")) : `(받지 못함) ${W.eval("S.notice")}`);
  }
  return finish(c, n, lines, times, false);
}
async function runPrep(c, n) {
  const p = c.prep;
  const inp = { who: pick(W.eval("WHO_OPTS"), p.who), grade: pick(W.eval("GRADE_OPTS"), p.grade), said: p.said, extra: p.extra,
    bg: pick(W.eval("BG_OPTS"), p.bg), lang: pick(W.eval("LANG_OPTS"), p.lang), state: pick(W.eval("STATE_OPTS"), p.state) };
  const lines = [], times = [];
  if (c.expect) lines.push(`(보려는 것: ${c.expect})`);
  lines.push(`입력: ${JSON.stringify(inp)}`);
  let bad = false;
  for (let k = 1; k <= (c.repeat || 1); k++) {
    W.eval(`S.ai = "yes"; go("prep");`);
    times.push(await timed(`makePrep(${JSON.stringify(inp)})`));
    const r = W.eval("S.prep.result"), notice = W.eval("S.prep.notice"), off = W.eval("OFFTOPIC_TEXT");
    if (c.repeat) lines.push(`--- ${k}번째 ---`);
    if (r && r.risk === "misuse") lines.push("risk: misuse → 화면에는 '이 요청은 도와드릴 수 없습니다' 안내만 나옵니다 (막힘, 정상)");
    else if (r && r.risk === "offtopic") lines.push("risk: offtopic → 화면에는 범위 밖 안내만 나옵니다 (막힘, 정상)");
    else if (!r && notice === off) lines.push(`[범위 밖 안내 (막힘, 정상)] ${notice}`);
    else { lines.push(r ? JSON.stringify(r, null, 2) : `[오류] ${notice}`); if (!r) bad = true; }
  }
  return finish(c, n, lines, times, bad);
}
function finish(c, n, lines, times, bad) {
  const title = `${n}. ${c.label}`;
  const body = lines.join("\n") + `\n(걸린 시간: ${times.join(", ")})`;
  show(title, body, bad); report.push(`### ${title}\n${body}`);
}

async function run(list, name) {
  ["runBasic", "runHard", "copy"].forEach(id => $(id).disabled = true);
  $("out").innerHTML = ""; report = [];
  $("status").textContent = "연습실을 불러오는 중…";
  if (!(await ready())) { $("status").textContent = "이 주소에서 AI가 켜져 있지 않습니다. site-config.js의 aiEndpoint를 확인해 주세요."; ["runBasic", "runHard"].forEach(id => $(id).disabled = false); return; }
  const start = Date.now();
  for (let i = 0; i < list.length; i++) {
    $("status").textContent = `${name} ${i + 1} / ${list.length} 진행 중… ${list[i].label}`;
    try { list[i].prep ? await runPrep(list[i], i + 1) : await runChat(list[i], i + 1); }
    catch (e) { finish(list[i], i + 1, [`[시험 페이지 오류] ${e && e.message}`], [], true); }
  }
  report.unshift(`# 질문 받기 연습실 AI 품질 시험 · ${name} (${new Date().toLocaleString("ko-KR")}, 모두 ${((Date.now() - start) / 1000).toFixed(0)}초)`);
  $("status").textContent = "끝났습니다. '결과 복사하기'를 눌러 Claude에게 붙여 주세요.";
  ["runBasic", "runHard", "copy"].forEach(id => $(id).disabled = false);
}
$("runBasic").onclick = () => run(BASIC, "기본 시험");
$("runHard").onclick = () => run(HARD, "강한 시험");
$("copy").onclick = () => {
  const text = report.join("\n\n");
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} ta.remove(); $("status").textContent = "복사했습니다. (안 되면 결과를 직접 선택해 복사해 주세요)"; };
  try { navigator.clipboard.writeText(text).then(() => { $("status").textContent = "복사했습니다. Claude에게 붙여 주세요."; }, fallback); } catch (e) { fallback(); }
};
ready().then(ok => { $("status").textContent = ok ? "준비됐습니다. 시험을 골라 눌러 주세요." : "이 주소에서 AI가 켜져 있지 않습니다. 사이트 주소(…github.io/hun/test.html)에서 열었는지 확인해 주세요."; });
</script>
