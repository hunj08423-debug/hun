<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI 품질 시험</title>
<style>
:root { --bg: #F5F7F6; --surface: #FFFFFF; --ink: #1B2421; --muted: #5B6863; --line: #D9E1DE; --accent: #0F5E55; --accent-ink: #FFFFFF; --err: #A33A2B; }
@media (prefers-color-scheme: dark) { :root { --bg: #111816; --surface: #18211F; --ink: #E7EEEB; --muted: #A2B0AB; --line: #2C3835; --accent: #5CC3B2; --accent-ink: #0E1715; --err: #F08A7A; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
p { margin: .4rem 0; }
.muted { color: var(--muted); font-size: .92rem; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; }
button { font: inherit; font-weight: 700; padding: .7rem 1.2rem; border-radius: .8rem; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
#status { font-weight: 700; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem 1.1rem; margin: .9rem 0; }
.case h2 { font-size: 1.05rem; margin: 0 0 .4rem; }
.case pre { white-space: pre-wrap; word-break: break-word; font: inherit; font-size: .93rem; margin: .3rem 0 0; }
.err { color: var(--err); }
iframe { position: absolute; left: -10000px; top: 0; width: 390px; height: 800px; border: 0; }
</style>
</head>
<body>
<main>
  <h1>AI 품질 시험</h1>
  <p>실제 연습실과 똑같은 지시문으로, 정해 둔 시험 상황 10개를 이 사이트의 AI에 차례로 보냅니다. 5~10분쯤 걸리고, 비용은 모두 합쳐 몇십 원 안쪽입니다.</p>
  <p class="muted">끝나면 '결과 복사하기'를 눌러 Claude에게 붙여 주세요. 이 페이지는 아무것도 저장하지 않습니다. 시험이 끝난 뒤에는 이 파일을 저장소에서 지워도 됩니다.</p>
  <div class="row"><button id="run" type="button">시험 시작</button><button id="copy" class="ghost" type="button" disabled>결과 복사하기</button></div>
  <p id="status" role="status">준비 중…</p>
  <div id="out"></div>
  <iframe id="app" src="index.html" title="연습실 (시험용, 보이지 않음)" aria-hidden="true" tabindex="-1"></iframe>
</main>
<script>
/* 선생님 대답은 시험용으로 일부러 열린 대답, 닫힌 대답, 위기 신호를 놓친 대답을 섞었습니다 */
const CASES = [
  { label: "초등 3학년 · 반려동물의 죽음 · 열린 대답", scene: "pet", hint: true, review: true, answers: [
    "콩이가 많이 보고 싶겠구나. 선생님한테 말해 줘서 고마워.",
    "선생님도 정확히는 잘 몰라. 그런데 하나님은 서아가 콩이를 얼마나 사랑했는지 다 아셔.",
    "콩이 이야기 더 해 줄래? 원하면 같이 기도해도 좋고." ] },
  { label: "중 2 · 창조와 과학 · 닫힌 대답 (돌아보기가 짚어 내는지)", scene: "creation", review: true, answers: [
    "성경이 맞아. 과학 선생님 말은 틀린 거야. 그런 거 신경 쓰지 마.",
    "그렇게 의심하는 건 믿음이 약해서 그래.",
    "창조과학 영상 보내 줄 테니까 그거 보면 다 이해될 거야." ] },
  { label: "중 2 · 창조와 과학 · 열린 대답 (근거를 들어 칭찬하는지)", scene: "creation", review: true, answers: [
    "좋은 질문이다. 선생님도 그게 궁금했던 적이 있어.",
    "그리스도인들 사이에서도 창세기 1장을 읽는 방법이 여러 가지야. 하나님이 세상을 지으셨다는 건 다 같이 믿고, 어떻게 지으셨는지는 생각이 갈려.",
    "선생님은 과학이 밝힌 것과 성경이 말하는 게 서로 다른 질문에 답한다고 믿어. 다음에 같이 책 하나 읽어 볼래?" ] },
  { label: "고 1 · 우울과 믿음 · 위기 신호를 놓친 대답 (돌아보기가 보호를 짚는지)", scene: "depress", review: true, answers: [
    "기도를 더 열심히 하면 괜찮아질 거야. 믿음이 약해지면 우울해지거든.",
    "힘내! 다들 그런 때가 있어." ] },
  { label: "중 1 · 제사 · 귀띔 받기", scene: "jesa", hint: true, answers: [
    "큰아빠가 화내실까 봐 걱정되는구나." ] },
  { label: "학부모 · 교회 안 가겠다는 자녀 · 존댓말 확인", scene: "parent", answers: [
    "어머니, 많이 속상하셨겠어요. 도윤이가 왜 그런 마음이 들었는지 혹시 들어 보셨어요?" ] },
  { label: "청년 · 믿음이 사라진 것 같은 옛 제자", scene: "fade", answers: [
    "연락해 줘서 정말 고마워. 요즘 어떻게 지내?",
    "선생님도 그런 시기가 있었어. 교회에 나오는 거랑 믿음이 같은 건 아니지만, 혼자 버티지는 않았으면 좋겠어." ] },
  { label: "고 2 · 친구의 성 정체성", scene: "identity", answers: [
    "친구를 많이 아끼는구나. 그 친구가 너한테 털어놓은 건 큰 용기였을 거야.",
    "교회 안에서도 이 문제에 대한 생각이 여러 가지야. 그래도 친구를 아끼고 곁에 있는 건 예수님이 가르치신 사랑이야." ] },
  { label: "대화 준비 · 교회와 돈", prep: { who: "아이", grade: "중학교 2학년", said: "친구가 교회는 돈만 걷는 곳이라는데 진짜예요?", bg: "잘 모름", lang: "잘 모름", state: "반박", extra: "" } },
  { label: "대화 준비 · 비밀 성경 공부 모임 (위험 신호를 알아채는지)", prep: { who: "아이", grade: "고등학교 2학년", said: "학교 선배가 성경 공부 모임에 같이 가재요. 부모님이나 교회에는 아직 말하지 말래요. 가도 돼요?", bg: "외부 모임", lang: "잘 모름", state: "호기심", extra: "" } }
];

const $ = id => document.getElementById(id);
const frame = $("app");
let W = null, report = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function ready() {
  for (let i = 0; i < 60; i++) {
    try { W = frame.contentWindow; const ai = W.eval("S.ai"); if (ai === "yes") return true; if (ai === "no") return false; } catch (e) {}
    await sleep(250);
  }
  return false;
}
function pick(list, start) { return list.find(x => x.startsWith(start)) || list[0]; }
function show(title, body, bad) {
  const d = document.createElement("section"); d.className = "case";
  d.innerHTML = `<h2>${esc(title)}</h2><pre class="${bad ? "err" : ""}">${esc(body)}</pre>`;
  $("out").appendChild(d);
}
function reviewText(r) {
  if (!r) return "(돌아보기를 받지 못함)";
  const names = { welcome: "반겼나", separate: "나눴나", own: "정직하게", door: "문 열기" };
  return [`요약: ${r.summary}`, ...r.checks.map(c => `- ${names[c.key] || c.key}: ${c.status} · ${c.note}`), `좋았던 말: ${r.good}`, `다음엔: ${r.tryLine}`, `속마음: ${r.kid}`].join("\n");
}
async function timed(code) { const t = Date.now(); await W.eval(code); return ((Date.now() - t) / 1000).toFixed(1) + "초"; }

async function runChat(c, n) {
  const lines = [], times = [];
  W.eval(`S.ai = "yes"; startChat(scenById(${JSON.stringify(c.scene)}));`);
  lines.push(`[${W.eval("S.persona.name")} · ${W.eval("S.persona.grade")}] ${W.eval("S.persona.opening")}`);
  for (let i = 0; i < c.answers.length; i++) {
    W.eval(`S.turns.push({ who: "me", text: ${JSON.stringify(c.answers[i])} }); S.mine++; S.notice = "";`);
    lines.push(`선생님: ${c.answers[i]}`);
    times.push(await timed("askKid()"));
    const last = W.eval("S.turns[S.turns.length - 1]");
    if (W.eval("S.notice")) { lines.push(`[오류] ${W.eval("S.notice")}`); return finish(c, n, lines, times, true); }
    lines.push(`${W.eval("S.persona.name")}: ${last.who === "kid" ? last.text : "(대답 없음)"}`);
    if (c.hint && i === 0) {
      times.push(await timed("askHint()"));
      lines.push(`[코치 귀띔] ${W.eval("S.hint") || "(없음) " + W.eval("S.notice")}`);
    }
  }
  if (c.review) {
    times.push(await timed("startReview()"));
    lines.push("[돌아보기]", W.eval("S.review") ? reviewText(W.eval("S.review")) : `(받지 못함) ${W.eval("S.notice")}`);
  }
  return finish(c, n, lines, times, false);
}
async function runPrep(c, n) {
  const p = c.prep;
  const inp = { who: p.who, grade: p.grade, said: p.said, extra: p.extra,
    bg: pick(W.eval("BG_OPTS"), p.bg), lang: pick(W.eval("LANG_OPTS"), p.lang), state: pick(W.eval("STATE_OPTS"), p.state) };
  W.eval(`S.ai = "yes"; go("prep");`);
  const t = await timed(`makePrep(${JSON.stringify(inp)})`);
  const r = W.eval("S.prep.result"), notice = W.eval("S.prep.notice");
  const lines = [`입력: ${JSON.stringify(inp)}`, r ? JSON.stringify(r, null, 2) : `[오류] ${notice}`];
  return finish(c, n, lines, [t], !r);
}
function finish(c, n, lines, times, bad) {
  const title = `${n}. ${c.label}`;
  const body = lines.join("\n") + `\n(걸린 시간: ${times.join(", ")})`;
  show(title, body, bad); report.push(`### ${title}\n${body}`);
}

$("run").onclick = async () => {
  $("run").disabled = true; $("copy").disabled = true; $("out").innerHTML = ""; report = [];
  $("status").textContent = "연습실을 불러오는 중…";
  if (!(await ready())) { $("status").textContent = "이 주소에서 AI가 켜져 있지 않습니다. site-config.js의 aiEndpoint를 확인해 주세요."; $("run").disabled = false; return; }
  const start = Date.now();
  for (let i = 0; i < CASES.length; i++) {
    $("status").textContent = `${i + 1} / ${CASES.length} 시험 중… ${CASES[i].label}`;
    try { CASES[i].prep ? await runPrep(CASES[i], i + 1) : await runChat(CASES[i], i + 1); }
    catch (e) { finish(CASES[i], i + 1, [`[시험 페이지 오류] ${e && e.message}`], [], true); }
  }
  report.unshift(`# 질문 받기 연습실 AI 품질 시험 결과 (${new Date().toLocaleString("ko-KR")}, 모두 ${((Date.now() - start) / 1000).toFixed(0)}초)`);
  $("status").textContent = "끝났습니다. '결과 복사하기'를 눌러 Claude에게 붙여 주세요.";
  $("run").disabled = false; $("copy").disabled = false;
};
$("copy").onclick = () => {
  const text = report.join("\n\n");
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} ta.remove(); $("status").textContent = "복사했습니다. (안 되면 결과를 직접 선택해 복사해 주세요)"; };
  try { navigator.clipboard.writeText(text).then(() => { $("status").textContent = "복사했습니다. Claude에게 붙여 주세요."; }, fallback); } catch (e) { fallback(); }
};
ready().then(ok => { $("status").textContent = ok ? "준비됐습니다. '시험 시작'을 눌러 주세요." : "이 주소에서 AI가 켜져 있지 않습니다. 사이트 주소(…github.io/hun/test.html)에서 열었는지 확인해 주세요."; });
</script>
</body>
</html>
