<div class="wrap">

  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="foot">3분 신학 도서관 · 체험판 · 감수 전입니다. 쓰신 대답과 대화는 이 페이지에 저장되지 않으며, 화면을 닫으면 사라집니다. AI 기능을 쓰면 답을 만들기 위해 쓰신 글이 Claude로 보내집니다. 아이를 알아볼 수 있는 정보(이름, 학교 등)는 넣지 마세요. <button class="foot-link" type="button" data-go="about">이용 안내</button></footer>

<script src="site-config.js"></script>

<script>

/* ===================== 상태와 도우미 ===================== */
const app = document.getElementById("app");
/* 독립 주소에서 열 때만 site-config.js가 QP_SITE를 채웁니다. Claude 안에서는 비어 있습니다. */
const SITE = window.QP_SITE || {};
function onClaude() { return !!(window.claude && window.claude.use); }
function aiOffText() {
  if (onClaude() || !Object.keys(SITE).length) return "AI 기능은 Claude에 로그인한 상태에서 이 페이지를 열면 쓸 수 있습니다. 로그인하지 않아도 'AI 없이' 표시가 있는 기능은 모두 그대로 쓸 수 있습니다.";
  return `이 주소에서는 AI 기능을 쓸 수 없습니다.${SITE.claudeUrl ? ` AI로 연습하려면 <a href="${esc(SITE.claudeUrl)}" target="_blank" rel="noopener">Claude 판</a>에서 여세요(Claude 로그인 필요).` : ""} 'AI 없이' 표시가 있는 기능은 여기서 모두 그대로 쓸 수 있습니다.`;
}
/* 독립 주소에서 site-config.js에 aiEndpoint(AI 중계 서버 주소)가 있으면 그 서버를 거쳐 AI를 씁니다.
   API 키는 중계 서버에만 있고 이 페이지에는 없습니다. */
const SITE_AI = Object.keys(SITE).length > 0 && !onClaude() && /^https?:\/\/\S+$/.test(String(SITE.aiEndpoint || "").trim());
function makeEndpointSample(url) {
  async function call(input, opts, json) {
    const aborted = () => !!(opts.signal && opts.signal.aborted);
    let res, data = null;
    try {
      res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ input, json, tier: opts.modelTier === "quick" ? "quick" : "deep" }), signal: opts.signal });
      data = await res.json().catch(() => null);
    } catch (e) { throw { code: aborted() ? "cancelled" : "network" }; }
    if (aborted()) throw { code: "cancelled" };
    if (!res.ok || !data || data.error || typeof data.text !== "string") throw { code: (data && data.error) || "network" };
    return data;
  }
  const s = async (input, opts = {}) => {
    const d = await call(input, opts, false);
    if (typeof opts.onText === "function") opts.onText({ text: d.text, delta: d.text });
    return { text: d.text, truncated: !!d.truncated };
  };
  s.json = async (input, opts = {}) => {
    const d = await call(input, opts, true);
    const t = d.text, a = t.indexOf("{"), b = t.lastIndexOf("}");
    try { if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1)); } catch (e) {}
    throw { code: "invalid_json", text: t };
  };
  return s;
}
let S = { view: "home", ai: "checking", scene: null, persona: null, turns: [], mine: 0, busy: false, notice: "", noticeErr: false, retryKid: false, review: null, self: {}, ctl: null, hint: "", hintBusy: false, prep: { result: null, busy: false, notice: "", input: null }, libTag: "", fb: null, from: "home" };
S.list = loadList();

const samplePromise = (async () => {
  try {
    if (SITE_AI) return makeEndpointSample(String(SITE.aiEndpoint).trim());
    if (!window.claude || !window.claude.use) return null;
    return await window.claude.use("sample");
  }
  catch (e) { return null; }
})();
samplePromise.then(s => { S.ai = s ? "yes" : "no"; if (S.view === "home" || S.view === "prep") render(); });

function iGa(n, isName = true) { const c = String(n).charCodeAt(String(n).length - 1); const bat = c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; return bat ? n + (isName ? "이가" : "이") : n + "가"; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
/* 문의처(site-config.js의 contact): 메일 주소면 메일 쓰기 링크, https 주소(오픈 채팅 등)면 새 창 링크 */

/* ---------- 우리 교회 목록 (이 기기 브라우저에만 저장) ---------- */
function cleanList(v) {
  const seen = new Set();
  const items = (Array.isArray(v && v.items) ? v.items : [])
    .map(x => Array.isArray(x) ? { id: x[0], st: x[1], memo: x[2] } : x)
    .filter(x => x && RES[x.id] && !seen.has(x.id) && seen.add(x.id))
    .map(x => ({ id: x.id, st: LIST_ST[x.st] ? x.st : "rec", memo: String(x.memo || "").slice(0, 120) }));
  return { name: String((v && v.name) || "우리 교회").slice(0, 40), items: items.slice(0, 60) };
}
function loadList() { try { const v = JSON.parse(localStorage.getItem(LIST_KEY) || "null"); if (v) return cleanList(v); } catch (e) {} return { name: "우리 교회", items: [] }; }
function saveList() { try { localStorage.setItem(LIST_KEY, JSON.stringify(S.list)); } catch (e) {} }
function toggleList(id) {
  const i = S.list.items.findIndex(x => x.id === id);
  if (i >= 0) S.list.items.splice(i, 1); else S.list.items.push({ id, st: "rec", memo: "" });
  saveList();
}
function listText() {
  const L = S.list, pick = st => L.items.filter(x => x.st === st);
  const line = x => { const r = RES[x.id]; return `- ${r.title} · ${r.kind}${/검색/.test(r.kind) ? "" : ` (${r.by})`}${r.url ? `\n  ${r.url}` : ""}${x.memo ? `\n  메모: ${x.memo}` : ""}`; };
  const parts = [`[${L.name} 자료 목록]`];
  if (pick("rec").length) parts.push("■ 추천\n" + pick("rec").map(line).join("\n"));
  if (pick("pastor").length) parts.push("■ 교역자와 함께 보기\n" + pick("pastor").map(line).join("\n"));
  parts.push("질문 받기 연습실에서 정리했습니다. 실제로 있는지까지만 확인한 자료이니, 아이에게 건네기 전에 내용을 먼저 살펴 주세요.");
  return parts.join("\n\n");
}
function b64e(s) { const b = new TextEncoder().encode(s); let t = ""; b.forEach(c => { t += String.fromCharCode(c); }); return btoa(t); }
function b64d(s) { const t = atob(s); const b = new Uint8Array(t.length); for (let i = 0; i < t.length; i++) b[i] = t.charCodeAt(i); return new TextDecoder().decode(b); }
function listCode() { return "QP1." + b64e(JSON.stringify({ n: S.list.name, i: S.list.items.map(x => [x.id, x.st, x.memo]) })); }
function readCode(code) {
  const m = String(code || "").replace(/\s+/g, "").match(/QP1\.([A-Za-z0-9+/=]+)/);
  if (!m) return null;
  try { const d = JSON.parse(b64d(m[1])); const L = cleanList({ name: d.n, items: d.i }); return L.items.length ? L : null; } catch (e) { return null; }
}
function reviewBox(s) { return `<div class="review small"><b>검토가 특히 필요한 장면</b> · ${esc(s.review)}</div>`; }
function protectBox(text, title) { return `<div class="protect"><b>${esc(title || "보호가 먼저입니다")}</b><span>${esc(text)}</span></div>`; }

  const desc = mode === "scene" ? "질문 하나를 고르세요. 두 장면에서 대답을 골라 봅니다." : "질문 하나를 고르세요. AI가 그 질문을 한 사람의 역할을 합니다.";
  app.innerHTML = `
  <div class="stack-lg">
    <button class="back" type="button" id="toHome">← 처음으로</button>
    <div class="stack-sm"><h1>${title}</h1><p class="muted">${desc}</p></div>
    ${scenFilterBar()}
    ${groupedScenes(s => `
          <button class="kid-btn" type="button" data-id="${s.id}" data-scen="${s.id}">
            <span class="who"><span class="tag ${scenTagClass(s)}">${esc(s.topic)}</span>${esc(s.name)} · ${esc(s.grade)} · ${esc(s.bg)}</span>
            <span class="q">"${esc(s.opening)}"</span>

/* ---------- 장면 고르기 (검색 · 학년 · 주제 묶음) ---------- */
function scenIsKid(s) { return /초등/.test(s.grade || ""); }
/* 질문한 사람이 누구인지: 아이(초등·중고등), 청년, 부모님, 그 밖의 어른 */
function roleOf(p) {
  if (!p) return "teen";
  if (p.who === "부모님" || /부모님/.test(p.name || "")) return "parent";
  if (p.who === "청년" || /청년/.test(p.grade || "")) return "youth";
  if (/어른/.test(p.grade || "") || /어른/.test(p.name || "")) return "adult";
  return /초등/.test(p.grade || "") ? "young" : "teen";
}
const KID_W = { w: "아이", it: "이 아이", gwa: "이 아이와", ege: "이 아이에게", ui: "아이의", eun: "아이는", me: "학생", eul: "학생을" };
const WHO_W = {
  young: KID_W, teen: KID_W,
  youth: { w: "청년", it: "이 청년", gwa: "이 청년과", ege: "이 청년에게", ui: "청년의", eun: "청년은", me: "청년", eul: "청년을" },
  parent: { w: "부모님", it: "이 부모님", gwa: "이 부모님과", ege: "이 부모님께", ui: "부모님의", eun: "부모님은", me: "부모", eul: "부모를" },
  adult: { w: "어른", it: "이분", gwa: "이분과", ege: "이분께", ui: "어른의", eun: "이분은", me: "어른", eul: "어른을" }
};
function W(p) { return WHO_W[roleOf(p)]; }
function scenAge(s) { const r = roleOf(s); return r === "young" ? "kid" : r === "teen" ? "teen" : "adult"; }
function scenTagClass(s) { return s.group === "보호가 필요한 상황" ? "warn" : s.review ? "mid" : ""; }
function scenFilterBar() {
  const a = S.scAge || "";
  return `<div class="stack-sm">
    <div class="field"><label for="scQ">받은 질문으로 찾기</label><input type="text" id="scQ" value="${esc(S.scQ || "")}" placeholder="예: 기도, 제사, 지옥, 진화, 우울" autocomplete="off"></div>
    <div class="chips" role="group" aria-label="학년 고르기">${[["", "전체"], ["kid", "초등부"], ["teen", "중고등부"], ["adult", "청년·어른"]].map(([k, v]) => `<button class="fchip" type="button" data-scage="${k}" aria-pressed="${a === k}">${v}</button>`).join("")}</div>
    <p class="small muted" id="scCount" aria-live="polite"></p>
  </div>`;
}
function groupedScenes(itemFn) {
  return GROUPS.map(g => {
    const list = SCEN.filter(s => s.group === g);
    if (!list.length) return "";
    return `<div class="stack-sm" data-group="${esc(g)}"><p class="group-title">${esc(g)}</p><div class="kids">${list.map(itemFn).join("")}</div></div>`;
  }).join("") + `<p class="small muted" id="scEmpty" hidden>맞는 질문이 없습니다. 다른 말로 찾아보시거나, AI가 있는 '대화 준비'에 실제로 받은 질문을 적어 보세요.</p>`;
}
function applyScenFilter() {
  const words = (S.scQ || "").trim().toLowerCase().split(/\s+/).filter(Boolean), a = S.scAge || "";
  let n = 0;
  app.querySelectorAll("[data-scen]").forEach(el => {
    const s = scenById(el.dataset.scen);
    const hay = [s.topic, s.opening, s.name, s.grade, s.bg, s.group, CORE_MSG[s.id] || ""].join(" ").toLowerCase();
    const ok = words.every(w => hay.includes(w)) && (!a || scenAge(s) === a);
    el.hidden = !ok; if (ok) n++;
  });
  app.querySelectorAll("[data-group]").forEach(g => { g.hidden = !g.querySelector("[data-scen]:not([hidden])"); });
  const c = document.getElementById("scCount"); if (c) c.textContent = n === SCEN.length ? `질문 ${n}개` : `맞는 질문 ${n}개`;
  const e = document.getElementById("scEmpty"); if (e) e.hidden = n > 0;
}
function bindScenFilter() {
  const q = document.getElementById("scQ");
  if (!q) return;
  q.addEventListener("input", () => { S.scQ = q.value; applyScenFilter(); });
  app.querySelectorAll("[data-scage]").forEach(b => b.onclick = () => {
    S.scAge = b.dataset.scage;
    app.querySelectorAll("[data-scage]").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    applyScenFilter();
  });
  applyScenFilter();
}

/* ---------- 장면 연습 ---------- */
function startScene(id) { S.scene = { id, round: 0, picked: [null, null], showAll: [false, false] }; go("scene"); }
/* '여는 대답'을 '답을 안 주는 대답'으로 오해하지 않도록 첫 장면의 코치 칸에서 한 번 풀어 둡니다 */
function openMeans(s) { return `'여는 대답'은 답을 주지 않는 대답이 아닙니다. 답을 준 뒤에도 ${iGa(W(s).w, false)} 다시 물을 수 있게 남겨 두는 대답입니다.`; }

function viewScene() {
  const sc = S.scene, s = scenById(sc.id), r = sc.round, round = s.rounds[r];
  const kidLine = r === 0 ? s.opening : round.kid;

  const prevType = r === 1 && sc.picked[0] ? sc.picked[0].type : null;
  app.innerHTML = `
  <div class="stack-lg">
    <button class="back" type="button" id="toPick">← ${s.who ? "다른 질문 고르기" : "아이 다시 고르기"}</button>
    <div class="stack-sm">
      <p><span class="tag ${s.group === "보호가 필요한 상황" ? "warn" : ""}">${esc(s.topic)}</span><span class="small muted">${esc(s.name)} · ${esc(s.grade)} · ${esc(s.bg)}</span></p>
      <h2>장면 ${r + 1} / 2</h2>
    </div>
    ${r === 0 && s.review ? reviewBox(s) : ""}
    ${r === 1 && prevType && prevType !== "open" ? `<p class="note">실제로는 앞 장면에서 대화가 끊겼을 수 있습니다. 문이 열렸다고 생각하고 다음 장면을 봅니다.</p>` : ""}
    <div class="chat">

      ${pick ? `<div class="bubble me"><span class="name">선생님 (나)</span>${esc(pick.say)}</div>
      <div class="bubble kid"><span class="name">${esc(s.name)}</span>${esc(pick.kid)}</div>` : ""}
    </div>
    ${pick ? `
      <div class="coach"><span class="pill ${TYPE[pick.type][1]}">${TYPE[pick.type][0]}</span><p>${esc(pick.coach)}</p>${r === 0 ? `<p class="small muted open-means">${esc(openMeans(s))}</p>` : ""}</div>
      ${sc.showAll[r] ? `<div class="stack">${round.opts.filter(o => o !== pick).map(o => `
        <div class="other"><span class="pill ${TYPE[o.type][1]}">${TYPE[o.type][0]}</span>
          <p><b>선생님:</b> ${esc(o.say)}</p><p><b>${esc(s.name)}:</b> ${esc(o.kid)}</p><p class="small muted">${esc(o.coach)}</p></div>`).join("")}</div>`
        : `<button class="btn ghost wide" type="button" id="showAll">다른 대답을 했다면? 나머지 두 대답도 보기</button>`}
      <button class="btn wide" type="button" id="nextBtn">${r === 0 ? "다음 장면으로" : "정리 보기"}</button>`
    : `
      <div class="stack-sm"><p class="label">선생님이라면 어떻게 대답하시겠어요?</p>
      <div class="opts">${round.opts.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="l">대답 ${i + 1}</span>${esc(o.say)}</button>`).join("")}</div></div>`}
  </div>`;
  document.getElementById("toPick").onclick = () => go("pickScene");
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => { sc.picked[r] = round.opts[+b.dataset.i]; viewScene(); });
  const sa = document.getElementById("showAll"); if (sa) sa.onclick = () => { sc.showAll[r] = true; viewScene(); };
  const nb = document.getElementById("nextBtn"); if (nb) nb.onclick = () => { if (r === 0) { sc.round = 1; go("scene"); } else go("sceneEnd"); };
}

function viewCard() {

      <ul class="pos core">${s.core.map(c => `<li><b>${esc(c[0])}</b><span class="small muted">근거: ${esc(c[1])}</span></li>`).join("")}</ul></section>

      <div class="copybox" id="cardText">${esc(cardText(s, closed, open))}</div>
      <button class="btn ghost" type="button" id="cardCopy">복사하기</button>
      <p class="small muted" id="cardMsg" aria-live="polite"></p>

  </div>`;
  document.getElementById("back").onclick = () => go(S.from || "home");
  document.getElementById("cardCopy").onclick = () => copyText(cardText(s, closed, open), document.getElementById("cardText"), document.getElementById("cardMsg"));
}
function cardText(s, closed, open) {
  const out = [`[참고 카드 · ${s.topic}]`, `${W(s).ui} 질문: "${s.opening}"`];
  if (s.review) out.push("", `검토가 특히 필요한 장면: ${s.review}`);
  if (s.protect) out.push("", `보호가 먼저: ${s.protect}`);
  out.push("", `닫는 대답: "${closed}"`, `여는 대답 (예시): "${open}"`, "", "그리스도인들은 이렇게 이해합니다 (어느 하나를 정답이라고 하지 않습니다)", ...s.positions.map(p => `- ${p[0]}: ${p[1]}`));
  if (s.posNote) out.push(s.posNote);
  out.push("", "어느 입장이든 함께 붙드는 것", ...s.core.map(c => `- ${c[0]} (${c[1]})`), "", `알아 두면 좋은 것: ${s.fact}`);
  if (s.res.length) { out.push("", "함께 볼 자료"); s.res.forEach(id => { const r = RES[id]; if (r) out.push(`- ${r.title} · ${r.kind}${r.url ? `\n  ${r.url}` : ""}`); }); }
  out.push("", "질문 받기 연습실 · 감수 전 체험판");
  return out.join("\n");
}

/* ---------- 직접 대답 연습 (AI) ---------- */
function startChat(persona) {
  if (S.ctl) S.ctl.abort();
  S = { ...S, view: "chat", persona, turns: [{ who: "kid", text: persona.opening }], mine: 0, busy: false, notice: "", noticeErr: false, retryKid: false, review: null, self: {}, ctl: null, hint: "", hintBusy: false, mode: S.ai === "no" ? "self" : "ai" };
  render(); window.scrollTo({ top: 0 });
}
function bubbles() {
  const p = S.persona;
  return S.turns.map(t => t.who === "kid"
    ? `<div class="bubble kid${t.thinking ? " thinking" : ""}"><span class="name">${esc(p.name)}</span>${esc(t.text)}</div>`
    : `<div class="bubble me"><span class="name">선생님 (나)</span>${esc(t.text)}</div>`).join("");
}
function viewChat() {
  const p = S.persona;

    ${S.hint ? `<div class="coach"><span class="pill good">코치의 귀띔</span><p style="white-space:pre-wrap">${esc(S.hint)}</p></div>` : ""}
    ${done ? `
      <div class="card"><p><b>대화를 마쳤습니다.</b> 이제 어땠는지 함께 돌아볼까요?</p><button class="btn wide" type="button" id="toReview">돌아보기</button></div>` : `
      <div class="composer">

        <p class="hint">휴대폰에서는 자판의 마이크 버튼을 누르고 말씀하시면 글자로 바뀝니다.</p>
        <div><p class="label" style="margin-bottom:.4rem">말문이 막히면 눌러서 넣어 보세요</p>
        <div class="chips">${(["parent", "adult"].includes(roleOf(p)) ? STARTERS_POLITE : STARTERS).map(t => `<button class="chip" type="button" data-t="${esc(t)}" ${S.busy ? "disabled" : ""}>${esc(t)}</button>`).join("")}</div></div>
        <div class="btn-row">
          <button class="btn" type="button" id="send" ${S.busy ? "disabled" : ""}>${S.mode === "ai" ? `${esc(p.name)}에게 보내기` : "다 썼어요"}</button>

  app.querySelectorAll(".chip").forEach(c => c.onclick = () => { const ta = document.getElementById("answer"); const add = c.dataset.t; ta.value = ta.value.trim() ? ta.value.replace(/\s*$/, " ") + add : add; ta.focus(); });

/* AI가 대사 앞에 '도윤:' 같은 이름표나 따옴표를 붙여 보내면 떼어 냅니다 */
function cleanKidLine(text, p) {
  const names = [p.name, W(p).me, "아이", "학생"].filter(Boolean).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const tag = new RegExp(`^(?:${names.join("|")})\\s*(?:\\([^)]{0,20}\\))?\\s*[:：]\\s*`);
  let s = String(text || "").trim();
  for (let i = 0; i < 3 && tag.test(s); i++) s = s.replace(tag, "").trim();
  return s.replace(/^["“]|["”]$/g, "");
}

  S.turns.push(bubble); viewChat(); scrollChat();
  const ctl = new AbortController(); S.ctl = ctl;

    else if (siteAiDown(code)) toSelfMode(errText(code) + SELF_TAIL);

    else { S.notice = errText(code); S.noticeErr = true; S.retryKid = code !== "too_long"; }
  } finally { S.busy = false; if (S.ctl === ctl) S.ctl = null; if (S.view === "chat") { viewChat(); scrollChat(); } }

async function makePrep(inp) {
  S.prep.input = inp; S.prep.notice = "";
  if (!inp.said) { S.prep.notice = "아이가 한 말이나 질문을 적어 주세요."; viewPrep(); return; }

  if (!sample) { S.ai = "no"; viewPrep(); return; }
  S.prep.busy = true; S.prep.result = null; viewPrep();
  const ctl = new AbortController(); S.ctl = ctl;
  try {
    const data = await sample.json(prepPrompt(inp), { signal: ctl.signal, cache: false });
    S.prep.result = data && typeof data === "object" ? data : null;
    if (!S.prep.result) S.prep.notice = "결과를 제대로 받지 못했습니다. 다시 눌러 주세요.";
  } catch (e) {
    const code = e && e.code;
    /* 설교문 같은 범위 밖 부탁에 AI가 JSON 대신 거절 문장만 보낸 경우 */
    if (code !== "cancelled") S.prep.notice = code === "invalid_json" && /연습만 도울 수/.test(String((e && e.text) || "")) ? OFFTOPIC_TEXT : errText(code);
    siteAiDown(code);
  }
  finally { S.prep.busy = false; if (S.ctl === ctl) S.ctl = null; if (S.view === "prep") viewPrep(); }
}

    rules: "교사가 알려 준 상황을 바탕으로 그럴듯한 사람을 연기하되, 지나치게 극적으로 만들지 않는다." + (inp.who && inp.who !== "아이" ? ` 너는 학생이 아니라 ${inp.who} 역할이다. 그 나이와 관계에 맞는 말투를 쓴다.` : "") + (inp.lang && inp.lang !== "잘 모름" ? ` 말투와 단어에 '${inp.lang}'가 자연스럽게 묻어난다.` : ""),
    focus: "아이의 배경을 짐작으로 단정하지 않고 먼저 묻는지, 공감하며 대화를 이어 가는지",
    positions: Array.isArray(r.positions) ? r.positions.map(x => [x && x.name, x && x.line]) : [],
    res: (Array.isArray(r.resources) ? r.resources : []).filter(id => RES[id]),
    protect: riskText || ""
  });
}

/* ---------- 아이의 상태 읽기 ---------- */
function viewState() {
  const st = S.st || (S.st = { topic: null, state: null, unsure: false });
  const s = st.topic ? scenById(st.topic) : null;
  let body = "", backLabel = "← 처음으로";
  if (!s) {
    body = `<div class="stack-sm"><p class="label">1단계 · 어떤 질문을 받았나요?</p>${scenFilterBar()}</div>
      ${groupedScenes(x => `<button class="kid-btn" type="button" data-topic="${x.id}" data-scen="${x.id}"><span class="who"><span class="tag ${scenTagClass(x)}">${esc(x.topic)}</span>${esc(x.grade)} · ${esc(x.bg)}</span><span class="q">"${esc(x.opening)}"</span></button>`)}`;
  } else if (!st.state) {
    backLabel = "← 질문 다시 고르기";
    body = `<div class="stack-sm"><p class="label">${W(s).ui} 질문</p><p class="quote">"${esc(s.opening)}"</p></div>

        <button class="btn ghost wide" type="button" id="unsure">잘 모르겠어요</button>
        ${st.unsure ? `<div class="card"><h3>먼저 이렇게 물어보세요</h3><ul>${ASK_STATE.map(a => `<li>${esc(a)}</li>`).join("")}</ul><p class="small muted">아이의 대답을 듣고 나서 다시 골라 보세요. 상태는 짐작이 아니라 물어서 압니다.</p></div>` : ""}
      </div>`;
  } else {
    backLabel = "← 다른 상태 고르기";

    body = `<div class="stack-sm"><p><span class="tag ${s.group === "보호가 필요한 상황" ? "warn" : ""}">${esc(s.topic)}</span><span class="pill mid">${esc(x.name)}</span></p><p class="quote">"${esc(s.opening)}"</p></div>
      ${s.protect ? protectBox(s.protect) : ""}
      <div class="promise"><b>${W(s).ege} 필요한 것</b><br>${esc(x.need)}</div>
      <section class="card"><h3>이 질문에서는</h3><p>${esc(t.line)}</p></section>
      <section class="card"><h3>첫마디 예시</h3><p class="quote warm">"${esc(x.first)}"</p>${roleOf(s) === "parent" ? `<p class="small muted">부모님께는 존댓말로 바꿔 말씀하세요.</p>` : ""}</section>
      <section class="card"><h3>건넬 자료</h3>${t.res.length ? `<div>${t.res.map(resItem).join("")}</div>` : `<p>지금은 자료보다 사람이 먼저입니다. 먼저 들어 주세요.</p>`}</section>
      <section class="card"><h3>피할 것</h3><p>${esc(x.avoid)}</p></section>
      ${st.state === "hurt" ? `<div class="notice small">상처가 학대나 자해처럼 위험한 일과 이어져 있다면, 자료 길잡이의 <b>'상처나 위험한 일을 털어놓을 때'</b>를 먼저 보세요. <button class="mini" type="button" id="toCare">바로 보기</button></div>` : ""}
      <div class="notice small">${esc(FAIR)}</div>
      <div class="btn-row">

        <button class="btn ghost" type="button" id="toCard2">참고 카드 보기</button>
        <button class="btn ghost" type="button" id="toTr2">같은 핵심, 다른 언어로 보기</button>
      </div>`;
  }
  app.innerHTML = `
  <div class="stack-lg">
    <button class="back" type="button" id="stBack">${backLabel}</button>
    <div class="stack-sm"><h1>아이의 상태 읽기</h1><p class="muted">같은 질문이라도 아이가 어디에 있느냐에 따라 필요한 것이 다릅니다. 대답하기 전에 먼저 물어서 확인하세요.</p></div>
    ${body}
  </div>`;
  document.getElementById("stBack").onclick = () => { if (st.state) st.state = null; else if (st.topic) { st.topic = null; st.unsure = false; } else { go("home"); return; } go("state"); };
  app.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { st.topic = b.dataset.topic; st.state = null; st.unsure = false; go("state"); });
  app.querySelectorAll("[data-state]").forEach(b => b.onclick = () => { st.state = b.dataset.state; go("state"); });

  const tt = document.getElementById("toTr2"); if (tt) tt.onclick = () => { S.tr = { topic: s.id, lang: null }; go("translate"); };
  const tca = document.getElementById("toCare"); if (tca) tca.onclick = () => { S.lib = { tab: "sit", sit: "care" }; go("library"); };
  bindScenFilter();
}

function sitText(s) {
  const out = [`[${s.name}]`];
  (s.protect || []).forEach(k => out.push("", "보호가 먼저: " + RISK.find(r => r.k === k).text));
  out.push("", "이렇게 활용하세요", ...s.advice.map(a => `- ${a}`), "", `오늘 할 첫걸음: ${s.first}`, "", "맞는 자료");
  s.res.forEach(id => { const r = RES[id]; if (r) out.push(`- ${r.title} · ${r.kind}${r.url ? `\n  ${r.url}` : ""}`); });
  out.push("", "질문 받기 연습실 '자료 길잡이'에서 정리했습니다.");
  return out.join("\n");
}

function bindMine(L) {
  const M = S.list;
  const refresh = () => { saveList(); const t = document.getElementById("lText"); if (t) t.textContent = listText(); const c = document.getElementById("cText"); if (c) c.textContent = listCode(); };
  const nm = document.getElementById("lName"); if (nm) nm.addEventListener("input", () => { M.name = nm.value.slice(0, 40) || "우리 교회"; refresh(); });
  app.querySelectorAll("[data-st]").forEach(s => s.addEventListener("change", () => { M.items[+s.dataset.st].st = s.value; refresh(); }));
  app.querySelectorAll("[data-memo]").forEach(s => s.addEventListener("input", () => { M.items[+s.dataset.memo].memo = s.value.slice(0, 120); refresh(); }));
  app.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { M.items.splice(+b.dataset.rm, 1); saveList(); viewLibrary(); });
  const lc = document.getElementById("lCopy"); if (lc) lc.onclick = () => copyText(listText(), document.getElementById("lText"), document.getElementById("lMsg"));
  const cc = document.getElementById("cCopy"); if (cc) cc.onclick = () => copyText(listCode(), document.getElementById("cText"), document.getElementById("cMsg"));
  const replaceWith = (key, nl, okText) => {
    const msg = document.getElementById("cLoadMsg");
    if (M.items.length && L.confirm !== key) { L.confirm = key; if (msg) msg.textContent = `지금 목록 ${M.items.length}개가 바뀝니다. 한 번 더 누르면 바꿉니다.`; return; }
    L.confirm = ""; L.note = okText; L.openShare = key === "code"; S.list = nl; saveList(); viewLibrary();
  };
  const cl = document.getElementById("cLoad"); if (cl) cl.onclick = () => {
    const nl = readCode(document.getElementById("cIn").value);
    if (!nl) { document.getElementById("cLoadMsg").textContent = "코드를 읽지 못했습니다. QP1. 로 시작하는 코드 전체를 붙여 넣어 주세요."; return; }
    replaceWith("code", nl, `'${nl.name}' 목록을 불러왔습니다. 자료 ${nl.items.length}개입니다.`);
  };
  const ls = document.getElementById("loadSample"); if (ls) ls.onclick = () => replaceWith("sample", cleanList(SAMPLE_PACK), "예시 꾸러미를 불러왔습니다. 가상의 교육부가 고른 것처럼 꾸민 예시입니다. 상태와 메모를 바꿔 보시고, 아래에서 단톡방용 글을 확인해 보세요.");
  const lx = document.getElementById("lClear"); if (lx) lx.onclick = () => {
    if (L.confirm !== "clear") { L.confirm = "clear"; lx.textContent = "한 번 더 누르면 비웁니다"; return; }
    L.confirm = ""; L.note = ""; S.list = { name: M.name, items: [] }; saveList(); viewLibrary();
  };
}

/* ---------- 의견 정리 ---------- */
function fbText(f) {
  return `[질문 받기 연습실 체험 의견]\n역할: ${f.role}\n전통·교단: ${f.trad || "말하지 않음"}\n써 본 기능: ${f.used.join(", ") || "-"}\n좋았던 점: ${f.good || "-"}\n걱정되는 점 · 악용될 수 있는 부분: ${f.worry || "-"}\n고쳤으면 하는 점: ${f.fix || "-"}`;
}
/* 메일 쓰기 링크: 너무 길면 메일 앱에서 잘릴 수 있어 붙여 넣기 안내로 바꿉니다 */
function fbMail(to, text) {
  const head = `mailto:${to}?subject=${encodeURIComponent("[질문 받기 연습실] 체험 의견")}&body=`;
  const full = head + encodeURIComponent(text);
  return full.length <= 6000
    ? { href: full, fits: true }
    : { href: head + encodeURIComponent("(의견이 길어서 자동으로 다 담지 못했습니다. 연습실의 '의견 정리하기'에서 '복사하기'를 누른 뒤 여기에 붙여 넣어 주세요.)"), fits: false };
}
function viewFeedback() {
  const f = S.fb || { role: "교육전도사·교육목사", used: [], good: "", worry: "", fix: "" };
  S.fb = f;
  const ROLES = ["교육전도사·교육목사", "교회학교 교사", "담임목사·부교역자", "이단 상담", "아동 보호·상담", "신학 연구자", "기타"];
  const TRADS = ["말하지 않음", "장로교", "감리교", "침례교", "성결교", "오순절·순복음", "성공회·루터교", "가톨릭", "그 밖의 교단", "교회에 다니지 않음"];
  const USED = ["장면 연습", "아이의 상태 읽기", "같은 핵심, 다른 언어", "선생님의 마음과 교회의 자리", "직접 대답 연습", "대화 준비", "질문 모임 6주 과정", "자료 길잡이"];
  const to = contactOf(), kind = contactKind(to);
  const guide = kind === "mail" ? `아래를 채우고 '메일 쓰기'를 누르면 메일 앱이 열립니다(받는 곳: ${contactHtml(to)}). 메일 앱이 열리지 않으면 '복사하기'를 누른 뒤 이 주소로 붙여 보내 주세요.`
    : kind ? `아래를 채우고 '복사하기'를 누르신 뒤, 문의처(${contactHtml(to)})로 붙여 보내 주세요.`
    : "아래를 채우고 '복사하기'를 누르신 뒤, 이 도구를 보내 드린 분께 메일이나 메시지로 붙여 보내 주세요.";
  app.innerHTML = `
  <div class="stack-lg">
    <button class="back" type="button" id="toHome">← 처음으로</button>
    <div class="stack-sm"><h1>의견 정리하기</h1><p class="muted">${guide} 이 페이지에는 아무것도 저장되지 않습니다.</p></div>
    <div class="composer">
      <div class="field"><label for="fRole">역할</label><select id="fRole">${ROLES.map(r => `<option ${r === f.role ? "selected" : ""}>${esc(r)}</option>`).join("")}</select></div>
      <div class="field"><label for="fTrad">전통·교단 <span class="hint">(여러 전통의 의견을 고루 듣기 위해 여쭙니다)</span></label><select id="fTrad">${TRADS.map(r => `<option ${r === (f.trad || "말하지 않음") ? "selected" : ""}>${esc(r)}</option>`).join("")}</select></div>
      <div class="field"><span class="label">써 본 기능</span><div class="chips">${USED.map(u => `<button class="fchip" type="button" data-u="${esc(u)}" aria-pressed="${f.used.includes(u)}">${esc(u)}</button>`).join("")}</div></div>
      <div class="field"><label for="fGood">좋았던 점</label><textarea id="fGood" style="min-height:4.5rem">${esc(f.good)}</textarea></div>
      <div class="field"><label for="fWorry">걱정되는 점 · 악용될 수 있는 부분</label><textarea id="fWorry" style="min-height:4.5rem">${esc(f.worry)}</textarea></div>
      <div class="field"><label for="fFix">고쳤으면 하는 점</label><textarea id="fFix" style="min-height:4.5rem">${esc(f.fix)}</textarea></div>
      <p class="label">보낼 내용 미리 보기</p>
      <div class="copybox" id="fbText">${esc(fbText(f))}</div>
      ${kind === "mail"
        ? `<div class="btn-row"><a class="btn" id="mailBtn" href="${esc(fbMail(to, fbText(f)).href)}">메일 쓰기</a><button class="btn ghost" type="button" id="copyBtn">복사하기</button></div>`
        : `<button class="btn" type="button" id="copyBtn">복사하기</button>`}
      <p class="small muted" id="copyMsg"></p>
    </div>
  </div>`;
  document.getElementById("toHome").onclick = () => go("home");
  const mailBtn = document.getElementById("mailBtn");
  const sync = () => { f.role = document.getElementById("fRole").value; f.trad = document.getElementById("fTrad").value; f.good = document.getElementById("fGood").value; f.worry = document.getElementById("fWorry").value; f.fix = document.getElementById("fFix").value; document.getElementById("fbText").textContent = fbText(f); document.getElementById("copyMsg").textContent = ""; if (mailBtn) mailBtn.href = fbMail(to, fbText(f)).href; };
  if (mailBtn) mailBtn.onclick = () => {
    sync();
    document.getElementById("copyMsg").textContent = fbMail(to, fbText(f)).fits
      ? `메일 앱이 열리지 않으면 '복사하기'를 누른 뒤 ${to} 로 보내 주세요.`
      : "의견이 길어서 메일에 다 담기지 않습니다. '복사하기'를 누른 뒤 메일 본문에 붙여 넣어 주세요.";
  };
  ["fRole", "fTrad", "fGood", "fWorry", "fFix"].forEach(id => { document.getElementById(id).addEventListener("input", sync); document.getElementById(id).addEventListener("change", sync); });
  app.querySelectorAll("[data-u]").forEach(b => b.onclick = () => { const u = b.dataset.u; f.used = f.used.includes(u) ? f.used.filter(x => x !== u) : [...f.used, u]; b.setAttribute("aria-pressed", f.used.includes(u) ? "true" : "false"); sync(); });
  document.getElementById("copyBtn").onclick = () => {
    sync();
    copyText(fbText(f), document.getElementById("fbText"), document.getElementById("copyMsg"));
  };
}

  if (Object.keys(SITE).length) return "이 주소에서는 AI 기능이 꺼져 있어서, 쓰신 글은 어디로도 보내지지 않습니다.";

}

/* 장면 바로 열기: 주소 끝에 ?scene=장면이름(예: ?scene=pet)을 붙이면 그 장면이 바로 열립니다.
   카톡 등으로 장면 하나를 나눌 때 씁니다. 없는 이름이면 평소처럼 첫 화면이 열립니다. */
function linkedScene() {
  try {
    const p = new URLSearchParams(location.search).get("scene") || (String(location.hash).match(/^#scene=([\w-]+)$/) || [])[1] || "";
    return scenById(p) ? p : null;
  } catch (e) { return null; }
}
const firstScene = linkedScene();
if (firstScene) startScene(firstScene); else render();
</script>
